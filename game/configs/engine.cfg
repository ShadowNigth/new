# ============================================================================
# ClassicFPS Engine - Configuración Principal (v1.0 - 8 Fases Completadas)
# Inspirado en el sistema de CVars de GoldSrc / Counter-Strike 1.6
# ============================================================================

window_title "ClassicFPS Engine v1.0 - Tactical FPS (All 8 Phases)"
vid_width 800
vid_height 600
vid_fullscreen 0
vid_resizable 1
gl_vsync 1
r_allow_software_fallback 1

# Color de limpieza de pantalla y niebla (estética clásica gris-azulada oscura)
r_clear_r 0.08
r_clear_g 0.11
r_clear_b 0.15
r_clear_a 1.00

# Cámara, Entrada, Armas y Niebla lineal clásica
fov_degrees 75.0
sensitivity 0.15
m_invert_pitch 0
cl_yawspeed 100.0
cam_flythrough 1
r_fog_enable 1
r_fog_start 10.0
r_fog_end 30.0
weapons_config "game/configs/weapons.cfg"

# Parámetros de Física y Controlador FPS (estilo GoldSrc)
sv_gravity 20.0
pm_jump_speed 6.8
pm_run_speed 6.5
pm_walk_speed 3.4
pm_crouch_speed 2.4
sv_accelerate 10.0
sv_airaccelerate 2.5
sv_friction 6.5
sv_stopspeed 1.8
pm_step_height 0.45
pm_eye_height_stand 1.62
pm_eye_height_crouch 0.85

# Frecuencia de simulación física/juego (Hz) y límite de FPS (0 = sin límite / VSync)
sys_ticrate 100.0
fps_max 120

# Nivel de registro: trace, debug, info, warn, error, fatal
log_level "info"
